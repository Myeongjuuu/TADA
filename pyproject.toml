[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tada-ecog"
version = "0.1.0"
description = "TADA: multi-scale ECoG-to-text decoding with encoding-guided reciprocal re-ranking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.4",
  "h5py>=3.10", "mne>=1.6", "torch>=2.2", "matplotlib>=3.8",
]

[project.optional-dependencies]
srm = ["brainiak", "mpi4py", "mpich; sys_platform == 'linux'"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
